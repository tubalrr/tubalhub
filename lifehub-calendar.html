<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeHub Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCF9F5;--tx:#1E1B16;--mut:#82796d;--bd:#EEE6DB;--card:#fffdfa;--blue:#dcecff;--bt:#245b9e;--pink:#ffe1eb;--pt:#a63f67;--yel:#fff0b9;--yt:#7b5b00;--green:#e4f1df;--gt:#3c6b36;--sh:0 16px 45px #41301f14}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1480px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:var(--tx);color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{margin:0;font-size:20px}.brand p{margin:3px 0;color:var(--mut);font-size:12px}.btn,.icon,.pill,.switch button{border:1px solid var(--bd);background:#fff;border-radius:13px;padding:10px 14px;color:var(--tx);font-weight:600}.primary{background:var(--tx)!important;color:#fff!important;border-color:var(--tx)!important}.late,.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:var(--sh)}.late{padding:17px 20px;margin-bottom:20px;background:#fff4ef;border-color:#f2ded4}.late h3{margin:0 0 8px;font-size:13px}.late-item{font-size:11px;padding:7px 0;border-top:1px solid #ead9d0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.cal{padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.month{display:flex;align-items:center;gap:10px}.month h2{margin:0;font-size:26px}.year{font-size:13px;color:var(--mut)}.nav{display:flex;gap:6px}.icon{width:38px;height:38px;padding:0}.switch{display:flex;background:#f2ede6;padding:4px;border-radius:13px}.switch button{border:0;background:transparent;padding:8px 13px;color:var(--mut)}.switch .active{background:#fff;color:var(--tx);box-shadow:0 3px 10px #0000000c}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:9px}.pill{white-space:nowrap;border-radius:999px;font-size:12px;color:var(--mut)}.pill.active{background:var(--tx);color:#fff;border-color:var(--tx)}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week{color:#9a9187;font-size:11px;font-weight:700;padding:4px}.week div{text-align:center}.day{min-height:112px;border:1px solid var(--bd);border-radius:16px;padding:8px;background:#fffdfa}.day.muted{opacity:.42}.day.selected{background:#f3eee7;border-color:#ded3c5}.date{font-size:12px;font-weight:700;margin-bottom:6px}.today{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--tx);color:#fff}.event{display:block;width:100%;border:0;text-align:left;margin:4px 0;padding:5px 7px;border-radius:8px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bill{background:#26231f;color:#fff}.task{background:var(--blue);color:var(--bt)}.family{background:var(--pink);color:var(--pt)}.birthday{background:var(--yel);color:var(--yt)}.renewal{background:var(--green);color:var(--gt)}.side{display:flex;flex-direction:column;gap:18px}.sidecard{padding:20px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-weight:800}.selected{font-size:27px;font-weight:800;margin:8px 0 14px}.detail{padding:11px 0;border-top:1px solid var(--bd)}.detail strong{font-size:12px}.detail p{margin:5px 0;font-size:11px;color:var(--mut)}.prayer-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{background:#f7f1e9;border-radius:16px;padding:12px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--mut)}.list{display:none}.list.show{display:block}.hide{display:none}.listrow{display:flex;gap:14px;padding:14px 5px;border-bottom:1px solid var(--bd)}.listdate{width:50px;text-align:center}.listdate b{display:block;font-size:20px}.listdate span{font-size:10px;color:var(--mut)}.modal{display:none;position:fixed;inset:0;background:#1e1b1680;align-items:center;justify-content:center;padding:20px;z-index:9}.modal.open{display:flex}.box{width:min(520px,100%);background:var(--card);border-radius:28px;padding:24px;box-shadow:0 30px 90px #0003}.modalhead{display:flex;justify-content:space-between}.modalhead h2{margin:0}.form{display:grid;gap:13px;margin-top:20px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:13px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:1050px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:720px){.app{padding:14px}.top{align-items:flex-start}.cal{padding:12px}.head{flex-wrap:wrap}.month{width:100%}.grid,.week{gap:3px}.day{min-height:78px;padding:6px;border-radius:12px}.event{font-size:8px;padding:4px}.side{display:flex}}@media(max-width:480px){.day{min-height:68px}.month h2{font-size:21px}.row{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">LH</div><div><h1>LifeHub Calendar</h1><p>Plan less. Live more. • Taglish planner</p></div></div><div><button class="btn" id="today">Today</button> <button class="btn primary" id="add">＋ Add event</button></div></header>
<div class="late"><h3>📌 Na-late na</h3><div id="late"></div></div>
<main class="layout"><section class="card cal"><div class="head"><div class="month"><div class="nav"><button class="icon" id="prev">‹</button><button class="icon" id="next">›</button></div><div><h2 id="mn"></h2><span class="year" id="yr"></span></div></div><div class="switch"><button id="cv" class="active">Calendar</button><button id="lv">List</button></div></div><div class="filters" id="filters"></div><div id="calendar"><div class="week" id="week"></div><div class="grid" id="grid"></div></div><div class="list" id="list"></div></section>
<aside class="side"><section class="card sidecard"><div class="eyebrow">Selected day</div><h3 id="st">Today</h3><div class="selected" id="sd"></div><div id="se"></div></section>
<section class="card sidecard"><div class="eyebrow">Prayer times</div><h3>Quezon City</h3><div class="prayer-row"><span>Fajr</span><b>4:38 AM</b></div><div class="prayer-row"><span>Dhuhr</span><b>12:03 PM</b></div><div class="prayer-row"><span>Asr</span><b>3:25 PM</b></div><div class="prayer-row"><span>Maghrib</span><b>6:08 PM</b></div><div class="prayer-row"><span>Isha</span><b>7:18 PM</b></div></section>
<section class="card sidecard"><div class="eyebrow">Monthly insight</div><h3>Monthly snapshot</h3><div class="stats"><div class="stat"><b>₱8,420</b><span>Gastos planned</span></div><div class="stat"><b id="taskstat">18/24</b><span>Tasks done</span></div></div></section></aside></main></div>
<div class="modal" id="modal"><div class="box"><div class="modalhead"><h2>Add event</h2><button class="icon" id="close">×</button></div><form class="form" id="form"><div class="field"><label>Title</label><input id="title" required placeholder="Hal. Submit portfolio"></div><div class="row"><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Time</label><input id="time" type="time"></div></div><div class="row"><div class="field"><label>Type</label><select id="type"><option value="bill">Bayaran</option><option value="task">Gawain</option><option value="family">Pamilya</option><option value="birthday">Kaarawan</option><option value="renewal">Renewal</option></select></div><div class="field"><label>Recurring</label><select><option>Hindi</option><option>Weekly</option><option>Monthly</option><option>Yearly</option></select></div></div><div class="modalactions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save event</button></div></form></div></div>
<script>
const months=['Enero','Pebrero','Marso','Abril','Mayo','Hunyo','Hulyo','Agosto','Setyembre','Oktubre','Nobyembre','Disyembre'],days=['Lun','Mar','Miy','Huw','Biy','Sab','Lin'],types={bill:'Bayaran',task:'Gawain',family:'Pamilya',birthday:'Kaarawan',renewal:'Renewal'},fs=[['all','Lahat'],['bill','Bayaran'],['task','Gawain'],['family','Pamilya'],['birthday','Kaarawan'],['renewal','Renewal']];
let vd=new Date(),sel=new Date(),filter='all',events=[['Bayaran PhilHealth','2026-09-03','bill'],['Submit portfolio','2026-09-08','task'],['Tawagan si Mama','2026-09-12','family'],['Birthday ni Mia','2026-09-18','birthday'],['Renewal — Canva','2026-09-22','renewal'],['Bayaran Internet','2026-09-25','bill'],['Submit report','2026-09-27','task'],['Renewal — Domain','2026-09-29','renewal']];
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),ev=()=>events.filter(e=>filter==='all'||e[2]===filter);
function render(){mn.textContent=months[vd.getMonth()];yr.textContent=vd.getFullYear();week.innerHTML=days.map(x=>'<div>'+x+'</div>').join('');let first=new Date(vd.getFullYear(),vd.getMonth(),1),start=(first.getDay()+6)%7,s='';for(let i=0;i<42;i++){let d=new Date(vd.getFullYear(),vd.getMonth(),i-start+1),key=iso(d),es=ev().filter(e=>e[1]===key),tod=key===iso(new Date()),selected=key===iso(sel);s+='<div class="day '+(d.getMonth()!==vd.getMonth()?'muted ':'')+(selected?'selected':'')+'" data-date="'+key+'"><div class="date"><span class="'+(tod?'today':'')+'">'+d.getDate()+'</span></div>'+es.slice(0,4).map(e=>'<button class="event '+e[2]+'">'+e[0]+'</button>').join('')+'</div>'}grid.innerHTML=s;grid.querySelectorAll('.day').forEach(x=>x.onclick=()=>{sel=new Date(x.dataset.date+'T12:00:00');render()});filters.innerHTML=fs.map(f=>'<button class="pill '+(filter===f[0]?'active':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>').join('');renderList();renderSide();renderLate()}
function renderList(){let m={};ev().forEach(e=>(m[e[1]]??=[]).push(e));list.innerHTML=Object.entries(m).sort().map(([k,a])=>{let d=new Date(k+'T12:00:00');return '<div class="listrow"><div class="listdate"><b>'+d.getDate()+'</b><span>'+days[(d.getDay()+6)%7]+'</span></div><div>'+a.map(e=>'<span class="event '+e[2]+'" style="display:inline-block;width:auto">'+types[e[2]]+' · '+e[0]+'</span>').join('')+'</div></div>'}).join('')||'<p style="color:var(--mut);padding:20px">Walang events sa filter na ito.</p>'}
function renderSide(){let a=ev().filter(e=>e[1]===iso(sel));st.textContent=iso(sel)===iso(new Date())?'Today':'Selected day';sd.textContent=months[sel.getMonth()]+' '+sel.getDate()+', '+sel.getFullYear();se.innerHTML=a.length?a.map(e=>'<div class="detail"><strong>'+e[0]+'</strong><p>'+types[e[2]]+' · Naka-schedule sa LifeHub.</p></div>').join(''):'<p style="font-size:11px;color:var(--mut)">Walang events. Perfect time para mag-reset. ✦</p>'}
function renderLate(){let a=events.filter(e=>e[1]<iso(new Date()));late.innerHTML=a.length?a.slice(-3).map(e=>'<div class="late-item"><b>'+e[0]+'</b> · '+e[1]+'</div>').join(''):'<span style="font-size:11px;color:var(--mut)">Walang overdue. Nice!</span>'}
prev.onclick=()=>{vd.setMonth(vd.getMonth()-1);render()};next.onclick=()=>{vd.setMonth(vd.getMonth()+1);render()};today.onclick=()=>{vd=new Date();sel=new Date();render()};filters.onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;render()}};cv.onclick=()=>{cv.classList.add('active');lv.classList.remove('active');calendar.classList.remove('hide');list.classList.remove('show')};lv.onclick=()=>{lv.classList.add('active');cv.classList.remove('active');calendar.classList.add('hide');list.classList.add('show')};
function openModal(){date.value=iso(sel);modal.classList.add('open');title.focus()}add.onclick=openModal;close.onclick=cancel.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};form.onsubmit=e=>{e.preventDefault();events.push([title.value,date.value,type.value]);sel=new Date(date.value+'T12:00:00');vd=new Date(sel);modal.classList.remove('open');form.reset();render()};render();
</script></body></html>
