name: Website Health Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.json"
      - "assets/**"
      - "pages/**"
      - "admin/**"
      - "api/**"
      - "components/**"
      - "css/**"
      - "data/**"
      - "js/**"
      - "lifehub/**"
      - "v2/**"
      - "v4.1/**"
      - "functions/**"
      - "ai-backend/**"
      - "service-worker.js"
      - "firebase-messaging-sw.js"
      - "scripts/**"
      - ".github/workflows/website-health-check.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.js"
      - "*.json"
      - "assets/**"
      - "pages/**"
      - "admin/**"
      - "api/**"
      - "components/**"
      - "css/**"
      - "data/**"
      - "js/**"
      - "lifehub/**"
      - "v2/**"
      - "v4.1/**"
      - "functions/**"
      - "ai-backend/**"
      - "service-worker.js"
      - "firebase-messaging-sw.js"
      - "scripts/**"
      - ".github/workflows/website-health-check.yml"

permissions:
  contents: read

jobs:
  validate-website:
    name: Validate website files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run website health checks
        run: node scripts/website-health-check.mjs
