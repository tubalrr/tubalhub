name: Build and Publish TUBAL HUB Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - messenger-apk

permissions:
  contents: write

concurrency:
  group: messenger-apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-messenger

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare signing key
        if: ${{ secrets.MESSENGER_KEYSTORE_BASE64 != '' }}
        env:
          MESSENGER_KEYSTORE_BASE64: ${{ secrets.MESSENGER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$MESSENGER_KEYSTORE_BASE64" | base64 --decode > messenger-release.jks

      - name: Build signed release APK
        if: ${{ secrets.MESSENGER_KEYSTORE_BASE64 != '' }}
        env:
          MESSENGER_STORE_PASSWORD: ${{ secrets.MESSENGER_KEYSTORE_PASSWORD }}
          MESSENGER_KEY_ALIAS: ${{ secrets.MESSENGER_KEY_ALIAS }}
          MESSENGER_KEY_PASSWORD: ${{ secrets.MESSENGER_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon             -PMESSENGER_STORE_FILE=messenger-release.jks             -PMESSENGER_STORE_PASSWORD="$MESSENGER_STORE_PASSWORD"             -PMESSENGER_KEY_ALIAS="$MESSENGER_KEY_ALIAS"             -PMESSENGER_KEY_PASSWORD="$MESSENGER_KEY_PASSWORD"

      - name: Build debug fallback
        if: ${{ secrets.MESSENGER_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::MESSENGER_KEYSTORE_BASE64 is not configured. Building debug APK. Install this build manually once; future self-updates require a stable signing key."
          gradle assembleDebug --no-daemon

      - name: Prepare release APK
        run: |
          mkdir -p release
          if [ -f app/build/outputs/apk/release/TUBAL-HUB-Messenger-release.apk ]; then
            cp app/build/outputs/apk/release/TUBAL-HUB-Messenger-release.apk release/TUBAL-HUB-Messenger-release.apk
          else
            cp app/build/outputs/apk/debug/TUBAL-HUB-Messenger-debug.apk release/TUBAL-HUB-Messenger-release.apk
          fi
          sha256sum release/TUBAL-HUB-Messenger-release.apk > release/TUBAL-HUB-Messenger-release.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUBAL-HUB-Messenger-v1.2.20
          path: |
            android-messenger/release/TUBAL-HUB-Messenger-release.apk
            android-messenger/release/TUBAL-HUB-Messenger-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.20
          name: TUBAL HUB Messenger v1.2.20
          body: |
            TUBAL HUB Messenger v1.2.20

            The APK is published for the TUBAL HUB Messenger in-app self-update system.
            For unattended future updates, keep the same Android signing key in the repository secrets.
          files: |
            android-messenger/release/TUBAL-HUB-Messenger-release.apk
            android-messenger/release/TUBAL-HUB-Messenger-release.apk.sha256
          overwrite_files: true
          make_latest: true
