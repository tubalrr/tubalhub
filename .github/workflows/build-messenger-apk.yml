name: Build and Publish TUBAL HUB Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - messenger-apk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-messenger

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Messenger APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/TUBAL-HUB-Messenger-debug.apk release/TUBAL-HUB-Messenger-release.apk
          sha256sum release/TUBAL-HUB-Messenger-release.apk > release/TUBAL-HUB-Messenger-release.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUBAL-HUB-Messenger-v1.2.17
          path: |
            android-messenger/release/TUBAL-HUB-Messenger-release.apk
            android-messenger/release/TUBAL-HUB-Messenger-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.17
          name: TUBAL HUB Messenger v1.2.17
          body: |
            TUBAL HUB Messenger v1.2.17

            This release is used by the in-app self-update system.
          files: |
            android-messenger/release/TUBAL-HUB-Messenger-release.apk
            android-messenger/release/TUBAL-HUB-Messenger-release.apk.sha256
          make_latest: true
