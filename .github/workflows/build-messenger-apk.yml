name: Build TUBAL HUB Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - messenger-apk

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-messenger
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TUBAL-HUB-Messenger-debug
          path: android-messenger/app/build/outputs/apk/debug/TUBAL-HUB-Messenger-debug.apk
          if-no-files-found: error
