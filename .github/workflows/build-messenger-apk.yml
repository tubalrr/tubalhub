name: Build and Publish TUBAL HUB Messenger APK
# Release is triggered manually or whenever the Messenger Android project changes.
# The release is built from the messenger-apk branch source, then published as a signed APK.

on:
  workflow_dispatch:
  push:
    branches:
      - messenger-apk
    paths:
      - .github/workflows/build-messenger-apk.yml
      - android-messenger/**
      - version.json

permissions:
  contents: write

concurrency:
  group: messenger-apk-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-messenger
    env:
      MESSENGER_KEYSTORE_BASE64: ${{ secrets.MESSENGER_KEYSTORE_BASE64 }}
      MESSENGER_STORE_PASSWORD: ${{ secrets.MESSENGER_KEYSTORE_PASSWORD }}
      MESSENGER_KEY_ALIAS: ${{ secrets.MESSENGER_KEY_ALIAS }}
      MESSENGER_KEY_PASSWORD: ${{ secrets.MESSENGER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Validate signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MESSENGER_KEYSTORE_BASE64" || { echo "::error::MESSENGER_KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$MESSENGER_STORE_PASSWORD" || { echo "::error::MESSENGER_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$MESSENGER_KEY_ALIAS" || { echo "::error::MESSENGER_KEY_ALIAS is missing."; exit 1; }
          test -n "$MESSENGER_KEY_PASSWORD" || { echo "::error::MESSENGER_KEY_PASSWORD is missing."; exit 1; }

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MESSENGER_KEYSTORE_BASE64" | base64 --decode > app/messenger-release.jks
          test -s app/messenger-release.jks || { echo "::error::Signing keystore is empty."; exit 1; }

      - name: Validate signing passwords
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PWD/app/messenger-release.jks"
          TEST_KEYSTORE="$RUNNER_TEMP/messenger-key-validation.p12"

          if ! keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$MESSENGER_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::MESSENGER_KEYSTORE_PASSWORD cannot open the permanent Messenger signing keystore."
            exit 1
          fi

          if ! keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$MESSENGER_STORE_PASSWORD" \
            -alias "$MESSENGER_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::MESSENGER_KEY_ALIAS was not found in the permanent Messenger signing keystore."
            exit 1
          fi

          rm -f "$TEST_KEYSTORE"
          if ! keytool -importkeystore \
            -srckeystore "$KEYSTORE" \
            -srcstoretype JKS \
            -srcstorepass "$MESSENGER_STORE_PASSWORD" \
            -srcalias "$MESSENGER_KEY_ALIAS" \
            -srckeypass "$MESSENGER_KEY_PASSWORD" \
            -destkeystore "$TEST_KEYSTORE" \
            -deststoretype PKCS12 \
            -deststorepass "validation-only" \
            -destkeypass "validation-only" \
            -noprompt >/dev/null 2>&1; then
            echo "::error::MESSENGER_KEY_PASSWORD cannot unlock the configured Messenger signing key."
            exit 1
          fi
          rm -f "$TEST_KEYSTORE"

          echo "Permanent Messenger signing keystore and key credentials validated."

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon \
            -PMESSENGER_STORE_FILE=messenger-release.jks \
            -PMESSENGER_STORE_PASSWORD="$MESSENGER_STORE_PASSWORD" \
            -PMESSENGER_KEY_ALIAS="$MESSENGER_KEY_ALIAS" \
            -PMESSENGER_KEY_PASSWORD="$MESSENGER_KEY_PASSWORD"

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/TUBAL-HUB-Messenger-release.apk"
          test -s "$APK" || { echo "::error::Release APK was not created."; exit 1; }
          mkdir -p release
          cp "$APK" release/TUBAL-HUB-Messenger-release.apk
          sha256sum release/TUBAL-HUB-Messenger-release.apk > release/TUBAL-HUB-Messenger-release.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUBAL-HUB-Messenger-v1.2.23
          path: |
            android-messenger/release/TUBAL-HUB-Messenger-release.apk
            android-messenger/release/TUBAL-HUB-Messenger-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.23
          name: TUBAL HUB Messenger v1.2.23
          body: |
            TUBAL HUB Messenger v1.2.23

            Redesigned Android login screen for phones.
            Improved Google Account sign-in presentation.
            Improved self-update handling and release verification.
          files: |
            android-messenger/release/TUBAL-HUB-Messenger-release.apk
            android-messenger/release/TUBAL-HUB-Messenger-release.apk.sha256
          overwrite_files: true
          make_latest: true
