<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tubal Chat · Real Messenger</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#f0f2f5;color:#050505}.shell{height:100dvh;display:flex;max-width:1440px;margin:auto;background:#fff;overflow:hidden}
.sidebar{width:360px;display:flex;flex-direction:column;border-right:1px solid #e4e6eb;background:#fff}
.top{padding:18px 16px 10px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.5px}.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0084ff,#00c6ff);color:#fff;font-weight:800}
.actions{display:flex;gap:7px}.icon{width:36px;height:36px;border:0;border-radius:50%;background:#e4e6eb;font-size:16px;cursor:pointer}.search{margin:0 16px 10px;height:40px;border-radius:22px;background:#f0f2f5;display:flex;align-items:center;padding:0 13px;gap:8px}.search input{border:0;background:none;outline:0;flex:1;font-size:15px}
.stories{display:flex;gap:9px;overflow:auto;padding:5px 14px 13px;border-bottom:1px solid #e4e6eb}.story{flex:0 0 62px;text-align:center;font-size:11px;overflow:hidden}.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#e4e6eb;font-weight:800}.story.online .avatar{border:3px solid #0084ff}.story span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.chats{flex:1;overflow:auto;padding:7px}.chatrow{width:100%;display:flex;gap:11px;align-items:center;padding:9px;border:0;border-radius:10px;background:#fff;text-align:left;cursor:pointer}.chatrow:hover,.chatrow.active{background:#e4e6eb}.chatrow .avatar{width:56px;height:56px;flex:0 0 56px}.meta{min-width:0;flex:1}.name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:13px;color:#65676b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.dot{width:10px;height:10px;border-radius:50%;background:#31a24c;border:2px solid #fff;position:absolute;right:0;bottom:0}.ava{position:relative;flex:0 0 56px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}.empty{flex:1;display:grid;place-items:center;text-align:center;padding:30px}.empty .hero{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0084ff,#00c6ff);color:#fff;font-size:38px;margin:auto}.empty h2{font-size:20px;margin:18px 0 5px}.empty p{color:#65676b;font-size:14px}
.chathead{height:60px;border-bottom:1px solid #e4e6eb;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.person{display:flex;gap:10px;align-items:center}.person .avatar{width:40px;height:40px}.person h3{margin:0;font-size:15px}.person small{color:#65676b}.headbuttons{display:flex;gap:3px}.headbuttons button{border:0;background:transparent;color:#0084ff;width:38px;height:38px;border-radius:50%;font-size:19px}
.messages{flex:1;overflow:auto;padding:16px}.msgwrap{display:flex;margin:5px 0}.msgwrap.me{justify-content:flex-end}.bubble{max-width:min(68%,560px);padding:9px 13px;border-radius:18px;background:#e4e6eb;font-size:15px;line-height:1.35;word-break:break-word}.me .bubble{background:linear-gradient(135deg,#0084ff,#00c6ff);color:#fff;border-bottom-right-radius:4px}.bubble small{display:block;margin-top:5px;font-size:9px;opacity:.7}
.composer{border-top:1px solid #e4e6eb;padding:8px;display:flex;align-items:flex-end;gap:6px}.composer textarea{flex:1;border:0;background:#f0f2f5;border-radius:20px;padding:10px 14px;outline:0;resize:none;min-height:40px;max-height:100px}.send{width:40px;height:40px;border:0;border-radius:50%;background:#0084ff;color:#fff;font-size:18px;cursor:pointer}
.status{font-size:11px;color:#65676b;padding:0 16px 8px}.login{position:fixed;inset:0;background:#f0f2f5;display:grid;place-items:center;z-index:10}.loginbox{background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 40px #0001;text-align:center;width:min(380px,90vw)}.loginbox button{border:0;border-radius:10px;background:#0084ff;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}
@media(max-width:800px){.sidebar{width:100%}.main{display:none}.shell.chat-open .sidebar{display:none}.shell.chat-open .main{display:flex}.back{display:block!important}.sidebar{max-width:none}.top{padding-top:12px}.back{border:0;background:none;color:#0084ff;font-size:20px;display:none}}
@media(min-width:801px){.back{display:none}}
</style>
</head>
<body>
<div id="login" class="login" hidden><div class="loginbox"><div class="logo" style="margin:auto">T</div><h2>Tubal Chat</h2><p>Sign in to load your real TUBAL HUB conversations.</p><button id="loginBtn">Continue with Google</button><p id="loginErr"></p></div></div>
<div id="app" class="shell" hidden>
<aside class="sidebar">
 <div class="top"><div class="brand"><div style="display:flex;gap:10px;align-items:center"><div class="logo">T</div><h1>tubal chat</h1></div><div class="actions"><button class="icon" id="themeBtn">☾</button><button class="icon">⌕</button><button class="icon">⋯</button></div></div></div>
 <div class="search">⌕ <input id="search" placeholder="Search"></div>
 <div class="status" id="liveStatus">Connecting to Firestore…</div>
 <div class="stories" id="stories"></div>
 <div class="chats" id="chats"></div>
</aside>
<main class="main">
 <div id="empty" class="empty"><div><div class="hero">✦</div><h2>Your messages</h2><p>Pili ng real member sa left. Walang demo contacts o hardcoded conversations.</p></div></div>
 <div id="conversation" style="display:none;flex:1;min-height:0;flex-direction:column">
  <header class="chathead"><div class="person"><button class="back" id="backBtn">‹</button><div class="avatar" id="headAvatar">M</div><div><h3 id="headName">Member</h3><small id="headStatus">Offline</small></div></div><div class="headbuttons"><button>☎</button><button>▣</button><button>⌕</button></div></header>
  <div class="messages" id="messages"></div>
  <div class="composer"><textarea id="input" rows="1" maxlength="500" placeholder="Aa"></textarea><button class="send" id="send">➤</button></div>
 </div>
</main>
</div>
<script type="module">
import {app,auth} from "./assets/js/firebase-config.js";
import {GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,collection,query,where,limit,orderBy,onSnapshot,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const db=getFirestore(app);let me=null,members=[],selected=null,unsubPresence=null,unsubMessages=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>String(n||"Member").split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"M";
const time=v=>{const d=v?.toDate?v.toDate():v?.seconds?new Date(v.seconds*1000):null;return d?d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):""};

function renderMembers(){
 const q=$("search").value.trim().toLowerCase();
 const list=members.filter(m=>(m.displayName||"Member").toLowerCase().includes(q));
 $("stories").innerHTML=list.slice(0,8).map(m=>story(m)).join("")||'<div style="padding:10px;color:#65676b;font-size:11px">No real members online yet.</div>';
 $("chats").innerHTML=list.map(m=>row(m)).join("")||'<div style="padding:20px;text-align:center;color:#65676b;font-size:12px">No real members found.</div>';
 document.querySelectorAll("[data-member]").forEach(b=>b.onclick=()=>openChat(b.dataset.member));
}
function story(m){return '<button class="story '+(m.online?'online':'')+'" data-member="'+esc(m.id)+'"><div class="avatar">'+esc(initials(m.displayName))+'</div><span>'+esc((m.displayName||"Member").split(" ")[0])+'</span></button>'}
function row(m){return '<button class="chatrow '+(selected?.id===m.id?'active':'')+'" data-member="'+esc(m.id)+'"><div class="ava"><div class="avatar">'+esc(initials(m.displayName))+'</div>'+(m.online?'<i class="dot"></i>':'')+'</div><div class="meta"><div class="name">'+esc(m.displayName||"Member")+'</div><div class="preview">'+(m.online?'Active now':'Offline')+'</div></div></button>'}
function subscribePresence(){
 if(unsubPresence)unsubPresence();
 unsubPresence=onSnapshot(collection(db,"presence"),snap=>{
   const now=Date.now();
   members=snap.docs.filter(d=>d.id!==me.uid).map(d=>({id:d.id,...d.data()})).map(x=>{const ms=x.lastSeen?.toMillis?x.lastSeen.toMillis():Number(x.lastSeen?.seconds||0)*1000;return {...x,online:x.online===true&&ms>0&&now-ms<=Number(x.presenceWindowMs||45000)}}).sort((a,b)=>Number(b.online)-Number(a.online)||String(a.displayName||"").localeCompare(String(b.displayName||"")));
   $("liveStatus").textContent="Real-time Firestore · "+members.length+" member"+(members.length===1?"":"s");
   renderMembers();
   if(selected){const fresh=members.find(x=>x.id===selected.id);if(fresh){selected=fresh;$("headStatus").textContent=fresh.online?"Active now":"Offline";}}
 },e=>$("liveStatus").textContent="Firestore unavailable: "+(e.message||"error"));
}
function openChat(id){
 const m=members.find(x=>x.id===id);if(!m)return;selected=m;
 $("empty").style.display="none";$("conversation").style.display="flex";$("headAvatar").textContent=initials(m.displayName);$("headName").textContent=m.displayName||"Member";$("headStatus").textContent=m.online?"Active now":"Offline";renderMembers();subscribeMessages();
}
function subscribeMessages(){
 if(unsubMessages)unsubMessages();
 $("messages").innerHTML='<div style="text-align:center;color:#65676b;font-size:12px;padding:20px">Loading real messages…</div>';
 const q=query(collection(db,"messages"),where("participants","array-contains",me.uid),limit(200));
 unsubMessages=onSnapshot(q,snap=>{
   const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>Array.isArray(x.participants)&&selected&&x.participants.includes(selected.id)).sort((a,b)=>(a.createdAt?.toMillis?.()||0)-(b.createdAt?.toMillis?.()||0));
   $("messages").innerHTML=docs.length?docs.map(m=>'<div class="msgwrap '+(m.senderId===me.uid||m.uid===me.uid?'me':'')+'"><div class="bubble">'+esc(m.text||m.textReal||"")+'<small>'+esc(time(m.createdAt))+'</small></div></div>').join(""):'<div style="text-align:center;color:#65676b;font-size:12px;padding:30px">No messages yet. Start the conversation.</div>';
   $("messages").scrollTop=$("messages").scrollHeight;
 },e=>$("messages").innerHTML='<div style="text-align:center;color:#65676b;padding:30px">Could not load messages: '+esc(e.message||"Firestore error")+'</div>');
}
async function send(){
 const body=$("input").value.trim();if(!body||!selected||body.length>500)return;
 try{await addDoc(collection(db,"messages"),{uid:me.uid,senderId:me.uid,receiverId:selected.id,participants:[me.uid,selected.id],displayName:me.displayName||me.email?.split("@")[0]||"Member",senderPhotoURL:me.photoURL||"",text:body,textReal:body,fileNameReal:"",type:"text",createdAt:serverTimestamp(),deliveredAt:null,seenAt:null,reactionsReal:{},pinnedReal:false});$("input").value="";}catch(e){alert(e.message||"Send failed")}}
$("search").oninput=renderMembers;$("send").onclick=send;$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("backBtn").onclick=()=>{selected=null;if(unsubMessages)unsubMessages();$("conversation").style.display="none";$("empty").style.display="grid";$("app").classList.remove("chat-open")};
$("themeBtn").onclick=()=>document.body.classList.toggle("dark");
$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("loginErr").textContent=e.message||"Sign-in failed"}};
onAuthStateChanged(auth,user=>{me=user;if(user){$("login").hidden=true;$("app").hidden=false;subscribePresence()}else{$("login").hidden=false;$("app").hidden=true}});
</script>
</body></html>
